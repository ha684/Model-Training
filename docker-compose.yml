version: '3.8'

services:
  # Pipeline runner (simple mode - không có retry/resume)
  # Chỉ dùng mode này cho testing nhanh
  pipeline-simple:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3-vl-pipeline:latest
    container_name: qwen3_pipeline_simple
    runtime: nvidia  # Cần NVIDIA Container Toolkit
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1,2,3
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./runs:/app/runs
      - ./reports:/app/reports
      - ./configs:/app/configs
      - ./.env:/app/.env:ro
    working_dir: /app
    command: python pipeline.py
    networks:
      - qwen_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - simple  # Chỉ start khi dùng: docker-compose --profile simple up

  # Prefect server (optional - chỉ cần nếu muốn UI)
  prefect-server:
    image: prefecthq/prefect:2-python3.11
    container_name: prefect_server
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
    volumes:
      - prefect-data:/root/.prefect
    networks:
      - qwen_network
    depends_on:
      - postgres
    command: prefect server start --host 0.0.0.0

  # Prefect worker (PRODUCTION MODE - có retry/resume)
  # Mode này chạy deployment qua worker
  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3-vl-pipeline:latest
    container_name: prefect_worker
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - PREFECT_API_URL=http://prefect-server:4200/api
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./runs:/app/runs
      - ./reports:/app/reports
      - ./configs:/app/configs
      - ./.env:/app/.env:ro
    working_dir: /app
    networks:
      - qwen_network
    depends_on:
      - prefect-server
    command: prefect worker start --pool default --type process
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # PostgreSQL for Prefect server (optional)
  postgres:
    image: postgres:15-alpine
    container_name: prefect_postgres
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=prefect
      - POSTGRES_DB=prefect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - qwen_network

networks:
  qwen_network:
    driver: bridge

volumes:
  prefect-data:
  postgres-data:
