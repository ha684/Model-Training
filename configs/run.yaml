run:
  name: "qwen3_vl_pipeline"
  seed: 3407

hf:
  token_env: "HF_TOKEN"
  org_or_user: "ha684"
  sft_repo_template: "qwen3-vl-8b-sft-{run_id}"
  grpo_repo_template: "qwen3-vl-8b-grpo-{run_id}"
  prod_alias_repo: "qwen3-vl-8b-grpo-prod"

baseline:
  sft_baseline_report: "reports/sft_best.json"
  grpo_baseline_report: "reports/grpo_prod.json"

train_sft:
  script: "bash scripts/train_multi_gpu.sh"
  num_gpus: 1
  model_name: "Qwen/Qwen3-VL-8B-Instruct"
  max_seq_length: 8192
  dataset_name: "ha684/vl-vi-en-ja-conv-mix-v1.2"
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  batch_size: 2
  eval_batch_size: 2
  grad_accum: 8
  epochs: 1
  learning_rate: 1e-5
  warmup_steps: 100
  weight_decay: 0.1
  eval_steps: 100
  logging_steps: 1
  output_dir: "outputs/sft_checkpoint"
  save_model: true
  model_save_path: "outputs/sft_model"
  report_to: "mlflow"
  mlflow_uri: "https://dagshub.com/robotpro682004/my-first-repo.mlflow"
  mlflow_experiment_name: "qwen3_vl_experiment"
  mlflow_run_name: "auto"
  push_to_hub: true

train_grpo:
  script: "bash scripts/train_grpo.sh"
  num_gpus: 4
  # model_name: ""
  max_seq_length: 8192
  dataset_name: "ha684/vl-vi-en-ja-conv-mix-v1.3"
  lora_r: 64
  lora_alpha: 128
  batch_size: 4
  eval_batch_size: 8
  grad_accum: 1
  max_steps: 600
  learning_rate: 5e-6
  warmup_steps: 10
  weight_decay: 0.01
  logging_steps: 1
  num_generations: 8
  max_prompt_length: 8192
  max_completion_length: 2048
  max_grad_norm: 1
  eval_steps: 100
  adam_beta1: 0.9
  adam_beta2: 0.99
  use_gspo: true
  output_dir: "outputs/grpo_checkpoint"
  save_model: true
  model_save_path: "outputs/grpo_model"
  report_to: "none"
  mlflow_uri: "https://dagshub.com/robotpro682004/my-first-repo.mlflow"
  mlflow_experiment_name: "qwen3_vl_grpo_experiment"
  mlflow_run_name: "auto"
  push_to_hub: true

serve:
  tensor_parallel_size: 4
  max_model_len: 8192
  gpu_memory_utilization: 0.9
  attention_backend: "TRITON_ATTN"
  host: "127.0.0.1"
  port_range: [8001, 8099]
  health_endpoint: "/v1/models"
  startup_timeout_sec: 900

eval:
  dataset_path: "ha684/vl-vi-en-ja-conv-mix-v1.3"
  # max_samples: 100

gate:
  sft:
    min_winrate_delta_vs_sft_baseline: -0.01
    min_format_pass_rate: 0.98
    max_p95_latency_ms: 1500
    require_all: true
  grpo:
    min_winrate_delta_vs_sft_new: 0.0
    min_winrate_delta_vs_grpo_baseline: 0.02
    min_format_pass_rate: 0.98
    max_p95_latency_ms: 1500
    require_all: true

notify:
  backend: "google_chat"
  google_chat_webhook_env: "GOOGLE_CHAT_WEBHOOK_URL"